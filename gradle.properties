# Impostazioni Gradle a livello di progetto.
#
# Se apri questo progetto in Android Studio, le impostazioni configurate
# tramite l'IDE potrebbero sovrascrivere quelle definite qui.

# Argomenti JVM usati dal demone Gradle — utile per evitare errori di
# memoria durante la build, specialmente con Compose.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# L'editor nel codice comune (dal 09/11/2026) non si compila per il telefono con 2 GB.
kotlin.daemon.jvmargs=-Xmx4096m

# Obbligatorio: abilita AndroidX. Senza questa riga, qualsiasi dipendenza
# androidx.* (Compose, Room, Navigation...) fa fallire la sincronizzazione.
android.useAndroidX=true

# Stile di formattazione Kotlin usato dall'IDE.
kotlin.code.style=official

# Namespacing delle classi R per build più veloci (default moderno di
# Android Studio per i nuovi progetti).
android.nonTransitiveRClass=true
